version: "3.9"

services:
  db:
    image: postgres:15
    container_name: tg_bot_db
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  migrate:
    image: ivanichmel/tg-bot:latest
    container_name: tg_bot_migrate
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c "
      migrate -path /app/migration -database ${POSTGRES_URL} up && exit 0 || exit 1"
    volumes:
      - ./db/migration:/app/migration

  app:
    image: ivanichmel/tg-bot:latest
    container_name: tg_bot_app
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_DRIVER: ${DB_DRIVER}
      DB_URL: ${POSTGRES_URL}
      TG_BOT_TOKEN: "${TG_BOT_TOKEN}"
    ports:
      - "8080:8080"

volumes:
  db_data:
